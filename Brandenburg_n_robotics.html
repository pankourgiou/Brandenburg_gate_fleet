<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brandenburg Gate Fleet – robotics simulation</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#070d22;--glass:rgba(10,18,44,.62);--line:rgba(160,185,255,.22);--text:#e8eeff;--mute:#9fb0dc;--rover:#ffb35c;--drone:#5ff0d0;--boat:#ff7a9a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:Figtree,system-ui,sans-serif;overflow:hidden}
#bg{position:fixed;inset:-40px;background-size:cover;background-position:center;filter:blur(28px) brightness(.55) saturate(1.2)}
canvas{position:fixed;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:manipulation}
.panel{position:fixed;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px}
#title{top:max(14px,env(safe-area-inset-top));left:14px;padding:12px 16px;max-width:290px}
h1{font:500 15px/1.2 Unbounded,sans-serif;margin:0 0 6px}
#title p{margin:0;font-size:13px;color:var(--mute);line-height:1.45}
#ctl{top:max(14px,env(safe-area-inset-top));right:14px;padding:6px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:min(380px,calc(100vw - 28px))}
button{font:600 13px Figtree,sans-serif;color:var(--text);background:transparent;border:1px solid transparent;border-radius:9px;padding:8px 12px;cursor:pointer}
button:hover{background:rgba(160,185,255,.14)}
button[aria-pressed=true]{background:rgba(160,185,255,.2);border-color:var(--line)}
button:focus-visible{outline:2px solid var(--drone);outline-offset:1px}
#tel{left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));padding:8px;display:flex;gap:8px;overflow-x:auto}
.chip{flex:0 0 auto;min-width:122px;padding:6px 10px;border-radius:9px;background:rgba(255,255,255,.05);font-size:12px}
.chip b{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.chip i{width:8px;height:8px;border-radius:50%}
.chip span{color:var(--mute)}
.bar{height:3px;border-radius:2px;background:rgba(255,255,255,.12);margin-top:5px;overflow:hidden}
.bar u{display:block;height:100%}
#set{top:132px;left:14px;width:250px;padding:10px 12px;max-height:calc(100% - 240px);overflow-y:auto}#set label{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12px;color:var(--mute);margin-bottom:9px}#set output{color:var(--text);font-weight:600}#set input{grid-column:1/-1;width:100%;accent-color:#5ff0d0;margin:0}#set h2{font:500 11px Unbounded,sans-serif;margin:10px 0 8px;color:var(--text)}#set h2:first-child{margin-top:0}
@media(max-width:700px){#title p{display:none}}
</style></head>
<body>
<div id="bg"></div>
<canvas id="c" aria-label="Robot fleet simulation at the Brandenburg Gate"></canvas>
<div class="panel" id="title"><h1>Brandenburg Gate Fleet</h1><p>Click the cobblestones, the columns or the sky to dispatch the nearest robot there.</p></div>
<div class="panel" id="ctl">
<button id="bT" aria-pressed="true">Tune</button>
<button id="bM" aria-pressed="true">Mesh links</button><button id="bP" aria-pressed="true">Routes</button><button id="bS">Pause</button>
</div>
<div class="panel" id="set"></div>
<div class="panel" id="tel"></div>

  ctx.setLineDash([])}
 ctx.globalCompositeOperation='source-over';
 for(const u of units){if(u.state==='scan'&&u.type!=='drone')rings(u);if(u.type==='rover')drawRover(u);else if(u.type==='walker')drawWalker(u);else if(u.type==='blimp')drawBlimp(u)}
 for(const u of units)if(u.type==='drone'){if(u.state==='scan')rings({pos:{x:u.pos.x,y:u.pos.y+38},type:'drone'});drawDrone(u)}
 ctx.globalAlpha=1;for(const u of units)if(u.state==='scan'||u.state==='goto')tag(u);fxFront();
 ctx.restore()}

let last=performance.now(),paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(now){const dt=Math.min(.05,(now-last)/1000)*S.speed;last=now;if(!paused){T+=dt;units.forEach(u=>u.update(dt));fx(dt)}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

function tel(){$('#tel').innerHTML=units.map(u=>{const b=Math.max(0,Math.min(100,u.bat));
 return`<div class="chip"><b><i style="background:${C[u.type]}"></i>${u.name}</b><span>${u.label}, ${Math.round(b)}%</span><div class="bar"><u style="width:${b}%;background:${b<25?'#ff6f91':C[u.type]}"></u></div></div>`}).join('')}
tel();setInterval(tel,400);

const tog=(id,k)=>$(id).onclick=e=>{show[k]=!show[k];e.target.setAttribute('aria-pressed',show[k])};tog('#bM','mesh');tog('#bP','routes');
$('#bS').textContent=paused?'Resume':'Pause';
$('#bS').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};
const SL=['Fleet',['Rovers','nR',0,9,1],['Drones','nD',0,6,1],[CFG.auxPl,'nB',0,4,1],['Sim speed','speed',0,3,.05],
 'Motion',['Trail length','trail',0,60,1],['Orbit radius','orbit',.5,1.6,.05],['Mesh range','mesh',80,500,10],
 'Light',['Light glow','glow',0,2,.05],['Night darkness','tint',0,.7,.02],['Tower glow','tglow',0,1,.02],['Tower hue','hue',0,360,1],['Hue cycle','cyc',0,1,.05],
 'Weather',['Rain','rain',0,1,.02],['Fireflies','fly',0,1,.02]];
const fleet={nR:'rover',nD:'drone',nB:CFG.kind},id={rover:4,drone:2,[CFG.kind]:1};
const mk={rover:()=>{const n=++id.rover;return new Bot('rover','Rover '+n,rk[n%3],Math.random(),rnd(24,38),Math.random()<.5?1:-1)},
 drone:()=>{const n=++id.drone;return new Drone('Drone '+n,rnd(150,270),rnd(30,70),rnd(0,6.28),rnd(.3,.55)*(Math.random()<.5?1:-1))},
 [CFG.kind]:()=>{const n=++id[CFG.kind];return new Bot(CFG.kind,CFG.aux+' '+n,'aux',Math.random(),rnd(18,26),Math.random()<.5?1:-1)}};
function sync(t,n){const c=units.filter(u=>u.type===t);while(c.length<n){const u=mk[t]();units.push(u);c.push(u)}while(c.length>n)units.splice(units.indexOf(c.pop()),1)}
$('#set').innerHTML=SL.map(r=>typeof r==='string'?`<h2>${r}</h2>`:`<label>${r[0]}<output id="o_${r[1]}">${S[r[1]]}</output><input type="range" id="s_${r[1]}" min="${r[2]}" max="${r[3]}" step="${r[4]}" value="${S[r[1]]}"></label>`).join('');
for(const r of SL)if(typeof r!=='string'){const k=r[1];$('#s_'+k).oninput=e=>{S[k]=+e.target.value;$('#o_'+k).textContent=S[k];if(fleet[k])sync(fleet[k],S[k])}}
$('#bT').onclick=e=>{const s=$('#set');s.hidden=!s.hidden;e.target.setAttribute('aria-pressed',!s.hidden)};
if(innerWidth<700){$('#set').hidden=true;$('#bT').setAttribute('aria-pressed','false')}
</script></body></html>
